name: Dependencies

# The Cloudflare Pages build installs with `npm clean-install`, which aborts if
# package-lock.json cannot describe a valid tree for package.json. Running the
# same install here catches lock drift on push instead of at deploy time.

on:
  push:
  workflow_dispatch:

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Lock file integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check package-lock.json is in sync with package.json
        run: bash scripts/check-lockfile.sh

      - name: Install from the lock file
        run: npm clean-install --progress=false
